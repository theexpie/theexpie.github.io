<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile</title>
  <style>
    :root {
      --win11-red-dark: #8b1a1a;
      --win11-red-med: #c41e3a;
      --win11-red-light: #ff4444;
      --win11-bg-light: #c5d9f1;
      --win11-surface: #f5f5f5;
      --win11-surface-alt: #efefef;
      --win11-text: #1a1a1a;
      --win11-muted: #717171;
      --win11-accent: #c41e3a;
      --win11-shadow: 0 12px 28px rgba(0,0,0,0.28);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      font-family: "Segoe UI", "Segoe UI Variable", sans-serif;
      background: #000;
      overflow: hidden;
      color: var(--win11-text);
    }

    body {
      background:
        linear-gradient(135deg, rgba(139, 26, 26, 0.25), rgba(255,255,255,0.02)),
        radial-gradient(circle at 25% 20%, rgba(255, 68, 68, 0.18), transparent 22%),
        linear-gradient(180deg, #8b4a5f 0%, #a5c9e8 40%, #b0d4f0 100%);
    }

    .desktop {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .desktop::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 28%),
        linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,0) 34%);
      pointer-events: none;
    }

    .main-area {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 24px 84px 24px;
      overflow: hidden;
    }

    .window {
      position: relative;
      width: min(840px, 75vw);
      height: min(660px, 75vh);
      background: rgba(255,255,255,0.97);
      border: 1px solid rgba(0,0,0,0.09);
      border-radius: 12px;
      box-shadow: var(--win11-shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .title-bar {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 48px;
      padding: 0 14px;
      background: linear-gradient(90deg, rgba(255,255,255,0.95), rgba(245,245,245,0.92));
      border-bottom: 1px solid rgba(0,0,0,0.07);
      z-index: 1;
    }

    .title-bar-content {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 500;
      color: #1a1a1a;
      letter-spacing: -0.2px;
    }

    .title-bar-icon {
      width: 20px;
      height: 20px;
      display: grid;
      place-items: center;
      border-radius: 4px;
      background: linear-gradient(135deg, #c41e3a, #ff6b6b);
      font-size: 12px;
    }

    .window-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      padding-right: 4px;
    }

    .window-button {
      width: 34px;
      height: 34px;
      border: none;
      background: transparent;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1a1a1a;
      font-size: 16px;
      line-height: 1;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .window-button:hover {
      background: rgba(0,0,0,0.04);
    }

    .window-button.close:hover {
      background: #c41e3a;
      color: #fff;
    }

    .window-button:active {
      transform: scale(0.96);
    }

    .content-area {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      background: rgba(255,255,255,0.96);
      z-index: 1;
    }

    .content-wrapper {
      padding: 24px 28px 20px 28px;
      overflow-y: auto;
      flex: 1;
    }

    .content-wrapper::-webkit-scrollbar { width: 11px; }
    .content-wrapper::-webkit-scrollbar-track { background: transparent; }
    .content-wrapper::-webkit-scrollbar-thumb {
      background: rgba(0,0,0,0.16);
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 999px;
    }
    .content-wrapper::-webkit-scrollbar-thumb:hover {
      background: rgba(0,0,0,0.22);
    }

    .start-label {
      font-size: 11px;
      font-weight: 600;
      color: #1a1a1a;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 12px;
      display: inline-block;
    }

    .pinned-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(72px, 1fr));
      gap: 8px;
      margin-bottom: 28px;
    }

    .grid-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 12px 8px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.1s ease;
    }

    .grid-item:hover {
      background: rgba(196, 30, 58, 0.06);
    }

    .grid-item-icon {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      background: linear-gradient(135deg, #c41e3a 0%, #ff6b6b 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: white;
      box-shadow: 0 2px 6px rgba(196,30,58,0.25);
    }

    .grid-item-label {
      font-size: 11px;
      color: #3a3a3a;
      text-align: center;
      font-weight: 500;
      line-height: 1.2;
    }

    .recommended-label {
      font-size: 11px;
      font-weight: 600;
      color: #1a1a1a;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .recommended-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .recommended-item {
      display: flex;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(196, 30, 58, 0.04);
      border: 1px solid rgba(196, 30, 58, 0.1);
      cursor: pointer;
      transition: all 0.1s ease;
    }

    .recommended-item:hover {
      background: rgba(196, 30, 58, 0.08);
      border-color: rgba(196, 30, 58, 0.2);
    }

    .recommended-icon {
      width: 32px;
      height: 32px;
      border-radius: 4px;
      background: linear-gradient(135deg, #c41e3a, #ff6b6b);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: white;
      flex-shrink: 0;
    }

    .recommended-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 12px;
    }

    .recommended-text-title {
      font-weight: 500;
      color: #1a1a1a;
    }

    .recommended-text-desc {
      font-size: 11px;
      color: #717171;
    }

    .profile-section {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 12px;
      border-radius: 8px;
      background: rgba(196, 30, 58, 0.05);
      border: 1px solid rgba(196, 30, 58, 0.08);
      margin-bottom: 16px;
    }

    .profile-avatar {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 6px;
      background: linear-gradient(135deg, #c41e3a 0%, #ff6b6b 100%);
      font-size: 24px;
      flex-shrink: 0;
      box-shadow: 0 2px 4px rgba(196,30,58,0.2);
    }

    .profile-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .profile-name {
      font-size: 13px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .profile-status {
      font-size: 11px;
      color: #717171;
    }

    .taskbar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 52px;
      background: rgba(24, 24, 24, 0.92);
      border-top: 1px solid rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 12px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 10;
    }

    .taskbar-start {
      width: 48px;
      height: 48px;
      border: none;
      background: transparent;
      display: grid;
      place-items: center;
      cursor: pointer;
      border-radius: 6px;
      font-size: 18px;
      color: #fff;
      transition: background 0.12s ease;
    }

    .taskbar-start:hover {
      background: rgba(255,255,255,0.1);
    }

    .taskbar-separator {
      width: 1px;
      height: 28px;
      background: rgba(255,255,255,0.08);
      margin: 0 4px;
    }

    .taskbar-apps {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
    }

    .taskbar-app {
      width: 46px;
      height: 46px;
      border-radius: 6px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.05);
      display: grid;
      place-items: center;
      font-size: 18px;
      color: rgba(255,255,255,0.9);
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .taskbar-app:hover {
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.1);
    }

    .taskbar-app.active {
      background: rgba(196, 30, 58, 0.3);
      border-color: rgba(196, 30, 58, 0.5);
    }

    .taskbar-spacer {
      flex: 1;
    }

    .taskbar-system {
      display: flex;
      align-items: center;
      gap: 2px;
      padding-left: 8px;
      border-left: 1px solid rgba(255,255,255,0.08);
      height: 46px;
    }

    .system-icon {
      width: 40px;
      height: 40px;
      border: none;
      background: transparent;
      border-radius: 6px;
      display: grid;
      place-items: center;
      color: rgba(255,255,255,0.8);
      cursor: pointer;
      transition: background 0.12s ease;
      font-size: 14px;
    }

    .system-icon:hover {
      background: rgba(255,255,255,0.08);
      color: #fff;
    }

    .time-display {
      font-size: 11px;
      color: rgba(255,255,255,0.9);
      width: 56px;
      text-align: center;
      letter-spacing: 0.2px;
      font-weight: 400;
    }

    @media (max-width: 980px) {
      .window { width: min(92vw, 720px); height: min(80vh, 600px); }
      .recommended-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 640px) {
      .main-area { padding: 12px 12px 68px 12px; }
      .window { width: 100%; height: auto; min-height: 480px; }
      .pinned-grid { grid-template-columns: repeat(4, 1fr); }
      .recommended-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="desktop">
    <div class="main-area">
      <div class="window" aria-label="Start Menu Profile">
        <div class="title-bar">
          <div class="title-bar-content">
            <div class="title-bar-icon">👤</div>
            <span>Profile</span>
          </div>
          <div class="window-controls">
            <button class="window-button" aria-label="Minimize">−</button>
            <button class="window-button" aria-label="Maximize">□</button>
            <button class="window-button close" aria-label="Close">✕</button>
          </div>
        </div>

        <div class="content-area">
          <div class="content-wrapper">
            <div class="start-label">Pinned</div>
            <div class="pinned-grid">
              <div class="grid-item">
                <div class="grid-item-icon">🌐</div>
                <div class="grid-item-label">Edge</div>
              </div>
              <div class="grid-item">
                <div class="grid-item-icon">📝</div>
                <div class="grid-item-label">Word</div>
              </div>
              <div class="grid-item">
                <div class="grid-item-icon">📊</div>
                <div class="grid-item-label">Excel</div>
              </div>
              <div class="grid-item">
                <div class="grid-item-icon">🎯</div>
                <div class="grid-item-label">PowerPoint</div>
              </div>
              <div class="grid-item">
                <div class="grid-item-icon">✉️</div>
                <div class="grid-item-label">Mail</div>
              </div>
              <div class="grid-item">
                <div class="grid-item-icon">📅</div>
                <div class="grid-item-label">Calendar</div>
              </div>
              <div class="grid-item">
                <div class="grid-item-icon">🛍️</div>
                <div class="grid-item-label">Store</div>
              </div>
              <div class="grid-item">
                <div class="grid-item-icon">📁</div>
                <div class="grid-item-label">Files</div>
              </div>
            </div>

            <div class="recommended-label">
              <span>Recommended</span>
              <span style="font-size: 11px; font-weight: normal; text-transform: none; letter-spacing: normal;">More ></span>
            </div>
            <div class="recommended-grid">
              <div class="recommended-item">
                <div class="recommended-icon">🚀</div>
                <div class="recommended-text">
                  <div class="recommended-text-title">Get Started</div>
                  <div class="recommended-text-desc">Welcome to Profile</div>
                </div>
              </div>
              <div class="recommended-item">
                <div class="recommended-icon">🎨</div>
                <div class="recommended-text">
                  <div class="recommended-text-title">Settings</div>
                  <div class="recommended-text-desc">Configure profile</div>
                </div>
              </div>
              <div class="recommended-item">
                <div class="recommended-icon">💼</div>
                <div class="recommended-text">
                  <div class="recommended-text-title">About Me</div>
                  <div class="recommended-text-desc">Developer & Designer</div>
                </div>
              </div>
              <div class="recommended-item">
                <div class="recommended-icon">🔗</div>
                <div class="recommended-text">
                  <div class="recommended-text-title">Connect</div>
                  <div class="recommended-text-desc">Social profiles</div>
                </div>
              </div>
            </div>

            <div style="border-top: 1px solid rgba(0,0,0,0.06); padding-top: 12px; margin-top: 12px;">
              <div class="profile-section">
                <div class="profile-avatar">👤</div>
                <div class="profile-info">
                  <div class="profile-name">Your Name</div>
                  <div class="profile-status">user@example.com</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="taskbar" aria-label="Windows taskbar">
      <button class="taskbar-start" aria-label="Start">⊞</button>
      <div class="taskbar-separator"></div>
      <div class="taskbar-apps">
        <div class="taskbar-app active" title="Profile">👤</div>
        <div class="taskbar-app" title="Edge">🌐</div>
        <div class="taskbar-app" title="Files">📁</div>
        <div class="taskbar-app" title="Store">🛍️</div>
      </div>
      <div class="taskbar-spacer"></div>
      <div class="taskbar-system">
        <button class="system-icon" aria-label="Search">🔍</button>
        <button class="system-icon" aria-label="Widgets">☰</button>
        <button class="system-icon" aria-label="Volume">🔊</button>
        <button class="system-icon" aria-label="Battery">🔋</button>
        <div class="time-display" id="time">1:51 PM</div>
      </div>
    </div>
  </div>

  <script>
    function updateTime() {
      const now = new Date();
      const hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const meridiem = hours >= 12 ? 'PM' : 'AM';
      const displayHours = hours % 12 || 12;
      document.getElementById('time').textContent = displayHours + ':' + minutes + ' ' + meridiem;
    }
    updateTime();
    setInterval(updateTime, 60000);
  </script>
</body>
</html>
